{% extends 'base.html' %}
{% block title %}Add Module{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h4 class="fw-bold mb-1">Add Module</h4>
    <p class="text-muted mb-4">for <strong>{{ course.title }}</strong></p>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="field-error">{{ field.errors.0 }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Add Module</button>
    </form>
</div>
{% endblock %}
